name: "GodAmp CI Export"
on: push
env:
  GODOT_VERSION: 4.4.1
jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/GodAmp.exe
          if [ ! -f "build/windows/GodAmp.exe" ]; then
            echo "ERROR: Windows build failed - GodAmp.exe not created"
            exit 1
          fi
          ls -la build/windows/
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-Windows
          path: build/windows/

  export-macos:
    name: macOS Export
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        run: |
          # Download and install Godot Mono
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip
          sudo mv Godot_mono.app /Applications/
          
          # Create symlink for command line
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /Applications/Godot_mono.app/Contents/MacOS/Godot /usr/local/bin/godot
          
          # Download export templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/
          mv ~/Library/Application\ Support/Godot/export_templates/templates ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable.mono
          
      - name: Setup Code Signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create certificates directory
          mkdir -p ~/certificates
          
          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > ~/certificates/certificate.p12
          
          # Create temporary keychain
          security create-keychain -p "temppass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temppass" build.keychain
          
          # Import certificate
          security import ~/certificates/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temppass" build.keychain
          
      - name: macOS Build and Sign
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          mkdir -p build/macos
          echo "Starting macOS universal export with signing..."
          
          # Export the app
          godot --headless --verbose --export-release "macOS" build/macos/GodAmp.app
          
          # Verify the app was created
          if [ ! -d "build/macos/GodAmp.app" ]; then
            echo "ERROR: macOS build failed - GodAmp.app not created"
            exit 1
          fi
          
          # Notarize the app
          echo "Submitting for notarization..."
          xcrun notarytool submit build/macos/GodAmp.app --apple-id "$APPLE_ID_USERNAME" --password "$APPLE_ID_PASSWORD" --team-id "XM765775ZW" --wait
          
          echo "✅ macOS universal build completed and notarized successfully!"
          ls -la build/macos/
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-macOS
          path: build/macos/

  export-linux:
    name: Linux Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/GodAmp.x86_64
          if [ ! -f "build/linux/GodAmp.x86_64" ]; then
            echo "ERROR: Linux build failed - GodAmp.x86_64 not created"
            exit 1
          fi
          ls -la build/linux/
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-Linux
          path: build/linux/