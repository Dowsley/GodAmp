  export-macos:
    name: macOS Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: macOS Build
        run: |
          mkdir -v -p build/macos
          echo "Starting macOS universal export..."
          # Create temp directories that Godot expects for universal builds
          mkdir -p /tmp/godot-publish-dotnet
          godot --headless --verbose --export-release "macOS" build/macos/GodAmp.app 2>&1 | tee export.log || true
          # Check if the build succeeded despite potential cleanup errors
          if [ ! -d "build/macos/GodAmp.app" ]; then
            echo "ERROR: macOS build failed - GodAmp.app not created"
            echo "Export log:"
            cat export.log
            exit 1
          fi
          echo "✅ macOS universal build completed successfully!"
          ls -la build/macos/
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-macOS
          path: build/macos/

