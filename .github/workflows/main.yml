name: "GodAmp CI Export"
on: push
env:
  GODOT_VERSION: 4.4.1
jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/GodAmp.exe
          if [ ! -f "build/windows/GodAmp.exe" ]; then
            echo "ERROR: Windows build failed - GodAmp.exe not created"
            exit 1
          fi
          ls -la build/windows/
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-Windows
          path: build/windows/

  build-macos:
    name: Build macOS (Unsigned)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: macOS Build (Unsigned)
        run: |
          mkdir -v -p build/macos
          echo "Starting macOS universal export..."
          godot --headless --verbose --export-release "macOS" build/macos/GodAmp.app
          if [ ! -d "build/macos/GodAmp.app" ]; then
            echo "ERROR: macOS build failed - GodAmp.app not created"
            exit 1
          fi
          echo "✅ macOS universal build completed!"
          ls -la build/macos/
      - name: Upload Unsigned App
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-macOS-Unsigned
          path: build/macos/

  sign-macos:
    name: Sign & Notarize macOS
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download Unsigned App
        uses: actions/download-artifact@v4
        with:
          name: GodAmp-macOS-Unsigned
          path: build/macos/
      - name: Setup Code Signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create certificates directory
          mkdir -p ~/certificates
          
          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > ~/certificates/certificate.p12
          
          # Create temporary keychain
          security create-keychain -p "temppass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temppass" build.keychain
          
          # Import certificate
          security import ~/certificates/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "temppass" build.keychain
          
      - name: Sign and Notarize
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          # Sign the app
          codesign --force --deep --sign "Joao Felipe Costa Dowsley (XM765775ZW)" build/macos/GodAmp.app
          
          # Verify signing
          codesign --verify --verbose build/macos/GodAmp.app
          
          # Create zip for notarization
          ditto -c -k --keepParent build/macos/GodAmp.app build/macos/GodAmp.zip
          
          # Submit for notarization
          echo "Submitting for notarization..."
          xcrun notarytool submit build/macos/GodAmp.zip --apple-id "$APPLE_ID_USERNAME" --password "$APPLE_ID_PASSWORD" --team-id "XM765775ZW" --wait
          
          # Staple the notarization
          xcrun stapler staple build/macos/GodAmp.app
          
          echo "✅ macOS app signed and notarized successfully!"
          ls -la build/macos/
      - name: Upload Signed macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-macOS
          path: build/macos/GodAmp.app

  export-linux:
    name: Linux Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:mono-4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/GodAmp.x86_64
          if [ ! -f "build/linux/GodAmp.x86_64" ]; then
            echo "ERROR: Linux build failed - GodAmp.x86_64 not created"
            exit 1
          fi
          ls -la build/linux/
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: GodAmp-Linux
          path: build/linux/